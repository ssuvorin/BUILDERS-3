<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1380" width="1240" height="1380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HeatSafe Voice Copilot — architecture and decision flow</title>
  <desc id="d">A voice pipeline running from the worker's tap through ElevenLabs speech-to-text, a Qwen LLM chosen for low latency, tool calls (a local search over the company's own documents; weather, web search and page fetches through context.dev), answer composition with the source named, and text-to-speech back to the worker. Decision gates branch off the pipeline to refusal, deferral and clarification outcomes.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1240" height="1380" fill="#ffffff"/>

  <!-- ══ header ══ -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1c1c1c">HeatSafe Voice Copilot</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">Architecture and decision flow. The pipeline runs down the centre; the gates branch right.</text>

  <!-- ══ column headings ══ -->
  <text x="40" y="128" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9ca3af">SOURCE AUTHORITY</text>
  <text x="440" y="128" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9ca3af">THE PIPELINE</text>
  <text x="890" y="128" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9ca3af">GATES — WHEN IT WON'T JUST ANSWER</text>

  <!-- ════════ CENTRE SPINE ════════ -->

  <!-- connectors, drawn first so boxes sit on top -->
  <g stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M610,212 L610,246"/>
    <path d="M610,326 L610,360"/>
    <path d="M610,440 L610,474"/>
    <path d="M610,554 L610,588"/>
    <path d="M610,806 L610,840"/>
    <path d="M610,920 L610,954"/>
    <path d="M610,1034 L610,1068"/>
  </g>

  <!-- 1 tap -->
  <rect x="430" y="148" width="360" height="64" rx="12" fill="#e8f1ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="610" y="176" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">1 · Worker taps once</text>
  <text x="610" y="196" font-size="13" fill="#6b7280" text-anchor="middle">one large target — hands free from here on</text>

  <!-- 2 stt -->
  <rect x="430" y="262" width="360" height="64" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="610" y="290" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">2 · ElevenLabs — speech to text</text>
  <text x="610" y="310" font-size="13" fill="#6b7280" text-anchor="middle">turn-taking, barge-in interruption</text>

  <!-- 3 llm -->
  <rect x="430" y="376" width="360" height="64" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="610" y="404" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">3 · LLM — Qwen</text>
  <text x="610" y="424" font-size="13" fill="#6b7280" text-anchor="middle">chosen for low latency in a live voice loop</text>

  <!-- 4 reasoning -->
  <rect x="430" y="490" width="360" height="64" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="610" y="518" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">4 · Reasoning</text>
  <text x="610" y="538" font-size="13" fill="#6b7280" text-anchor="middle">which tools does this question need?</text>

  <!-- 5 tools -->
  <rect x="430" y="604" width="360" height="202" rx="12" fill="#e3f5fd" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="610" y="632" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">5 · Tool calls</text>
  <text x="610" y="652" font-size="13" fill="#6b7280" text-anchor="middle">weather + web via context.dev</text>
  <rect x="452" y="664" width="316" height="30" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="468" y="684" font-size="13.5" fill="#1c1c1c"><tspan font-weight="600">search_sops</tspan> — the company's own pack</text>
  <rect x="452" y="698" width="316" height="30" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="468" y="718" font-size="13.5" fill="#1c1c1c"><tspan font-weight="600">check_weather</tspan> — wind, gusts, heat</text>
  <rect x="452" y="732" width="316" height="30" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="468" y="752" font-size="13.5" fill="#1c1c1c"><tspan font-weight="600">web_search</tspan> — find official sources</text>
  <rect x="452" y="766" width="316" height="30" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="468" y="786" font-size="13.5" fill="#1c1c1c"><tspan font-weight="600">web_lookup</tspan> — read the chosen page</text>

  <!-- 6 compose -->
  <rect x="430" y="856" width="360" height="64" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="610" y="884" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">6 · Compose the answer</text>
  <text x="610" y="904" font-size="13" fill="#6b7280" text-anchor="middle">the source document is named, every time</text>

  <!-- 7 tts -->
  <rect x="430" y="970" width="360" height="64" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="610" y="998" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">7 · ElevenLabs — text to speech</text>
  <text x="610" y="1018" font-size="13" fill="#6b7280" text-anchor="middle">calm, terse, numbers spoken plainly</text>

  <!-- 8 audio out -->
  <rect x="430" y="1084" width="360" height="64" rx="12" fill="#dcfbee" stroke="#10b981" stroke-width="1.5"/>
  <text x="610" y="1112" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle">8 · Answer, spoken</text>
  <text x="610" y="1132" font-size="13" fill="#6b7280" text-anchor="middle">interruptible mid-sentence</text>

  <!-- 9 loop back -->
  <path d="M430,1116 L392,1116 Q372,1116 372,1096 L372,200 Q372,180 392,180 L430,180"
        stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <rect x="182" y="1168" width="400" height="60" rx="10" fill="#e8f1ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="382" y="1192" font-size="13.5" font-weight="700" fill="#1c1c1c" text-anchor="middle">9 · Session context is held for the next turn</text>
  <text x="382" y="1212" font-size="12.5" fill="#6b7280" text-anchor="middle">subject + last reading, so “what about that one” resolves</text>
  <path d="M382,1168 L382,1140 Q382,1130 392,1130 L430,1130" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>

  <!-- ════════ LEFT — source authority ════════ -->
  <rect x="40" y="148" width="320" height="222" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="60" y="176" font-size="13.5" font-weight="700" fill="#1c1c1c">When sources disagree, higher wins</text>
  <rect x="60" y="190" width="280" height="34" rx="8" fill="#e8f1ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="74" y="212" font-size="13" font-weight="600" fill="#1c1c1c">1 · Company documents</text>
  <rect x="60" y="230" width="280" height="34" rx="8" fill="#ffffff" stroke="#c8cbd0" stroke-width="1"/>
  <text x="74" y="252" font-size="13" fill="#1c1c1c">2 · Regional law &amp; official guidance</text>
  <rect x="60" y="270" width="280" height="34" rx="8" fill="#ffffff" stroke="#c8cbd0" stroke-width="1"/>
  <text x="74" y="292" font-size="13" fill="#1c1c1c">3 · Manufacturer documentation</text>
  <rect x="60" y="310" width="280" height="34" rx="8" fill="#ffffff" stroke="#e1e4ea" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="74" y="332" font-size="13" fill="#6b7280">4 · General web — last resort</text>
  <text x="60" y="360" font-size="12" fill="#6b7280">If 4 is all there is, it says so out loud.</text>

  <!-- thresholds note -->
  <rect x="40" y="394" width="320" height="96" rx="12" fill="#e3f5fd" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="60" y="420" font-size="13.5" font-weight="700" fill="#1c1c1c">Thresholds are read, not written</text>
  <text x="60" y="442" font-size="12.5" fill="#1c1c1c">Wind bands, heat bands and the midday</text>
  <text x="60" y="460" font-size="12.5" fill="#1c1c1c">break are parsed from the client's own</text>
  <text x="60" y="478" font-size="12.5" fill="#1c1c1c">policy document. Nothing is hardcoded.</text>

  <!-- logging -->
  <rect x="40" y="514" width="320" height="78" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="60" y="540" font-size="13.5" font-weight="700" fill="#1c1c1c">Logged</text>
  <text x="60" y="562" font-size="12.5" fill="#1c1c1c">Every answer is recorded with its source</text>
  <text x="60" y="580" font-size="12.5" fill="#1c1c1c">and timestamp.</text>

  <!-- out of scope -->
  <rect x="40" y="616" width="320" height="96" rx="12" fill="#ffffff" stroke="#e1e4ea" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="60" y="642" font-size="13.5" font-weight="700" fill="#6b7280">Out of scope, deliberately</text>
  <text x="60" y="664" font-size="12.5" fill="#6b7280">Offline mode · accounts · persistence ·</text>
  <text x="60" y="682" font-size="12.5" fill="#6b7280">a real ingestion pipeline. Named rather</text>
  <text x="60" y="700" font-size="12.5" fill="#6b7280">than faked.</text>

  <!-- ════════ RIGHT — gates ════════ -->
  <g stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#aw)" stroke-dasharray="5 4">
    <path d="M790,294 L860,294"/>
    <path d="M790,408 L860,408"/>
    <path d="M790,700 L860,700"/>
    <path d="M790,888 L860,888"/>
    <path d="M790,1002 L860,1002"/>
  </g>
  <g stroke="#0ea5e9" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4">
    <path d="M790,600 L860,600"/>
  </g>
  <path d="M790,1116 L860,1116" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/>

  <!-- A confidence -->
  <rect x="880" y="262" width="320" height="66" rx="12" fill="#fdf3d9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="898" y="288" font-size="13.5" font-weight="700" fill="#1c1c1c">Transcription unclear?</text>
  <text x="898" y="310" font-size="12.5" fill="#1c1c1c">“Say that again.” Never answer a guess.</text>

  <!-- B off domain -->
  <rect x="880" y="376" width="320" height="66" rx="12" fill="#fdf3d9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="898" y="402" font-size="13.5" font-weight="700" fill="#1c1c1c">Not about the work?</text>
  <text x="898" y="424" font-size="12.5" fill="#1c1c1c">One short decline. No lecture.</text>

  <!-- C staleness -->
  <rect x="880" y="562" width="320" height="84" rx="12" fill="#e3f5fd" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="898" y="588" font-size="13.5" font-weight="700" fill="#1c1c1c">Reading older than 10 minutes?</text>
  <text x="898" y="610" font-size="12.5" fill="#1c1c1c">Treat it as unavailable. Give the limit</text>
  <text x="898" y="628" font-size="12.5" fill="#1c1c1c">from the document, refuse the comparison.</text>

  <!-- D no coverage -->
  <rect x="880" y="668" width="320" height="66" rx="12" fill="#fdf3d9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="898" y="694" font-size="13.5" font-weight="700" fill="#1c1c1c">No source covers it at all?</text>
  <text x="898" y="716" font-size="12.5" fill="#1c1c1c">“I don't know. Ask someone else.” + contact.</text>

  <!-- E ambiguity -->
  <rect x="880" y="856" width="320" height="66" rx="12" fill="#fdf3d9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="898" y="882" font-size="13.5" font-weight="700" fill="#1c1c1c">Two possible meanings?</text>
  <text x="898" y="904" font-size="12.5" fill="#1c1c1c">Ask which one. Never guess between them.</text>

  <!-- F safety critical -->
  <rect x="880" y="970" width="320" height="66" rx="12" fill="#fdf3d9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="898" y="996" font-size="13.5" font-weight="700" fill="#1c1c1c">Safety-critical?</text>
  <text x="898" y="1018" font-size="12.5" fill="#1c1c1c">Add: confirm with your supervisor first.</text>

  <!-- G never -->
  <rect x="880" y="1084" width="320" height="102" rx="12" fill="#fdeeee" stroke="#ef4444" stroke-width="1.5"/>
  <text x="898" y="1110" font-size="13.5" font-weight="700" fill="#1c1c1c">“Is it safe for me to go up right now?”</text>
  <text x="898" y="1132" font-size="12.5" fill="#1c1c1c">Never answers yes. Gives the conditions</text>
  <text x="898" y="1150" font-size="12.5" fill="#1c1c1c">and the thresholds, then hands the</text>
  <text x="898" y="1168" font-size="12.5" fill="#1c1c1c">decision to the supervisor.</text>

  <!-- ══ footer creed ══ -->
  <rect x="40" y="1258" width="1160" height="72" rx="12" fill="#f7f9fb" stroke="#e1e4ea" stroke-width="1.5"/>
  <text x="620" y="1288" font-size="16" font-weight="700" fill="#1c1c1c" text-anchor="middle">HeatSafe retrieves. HeatSafe explains. HeatSafe cites. HeatSafe never guesses.</text>
  <text x="620" y="1312" font-size="13.5" fill="#6b7280" text-anchor="middle">It advises. The stop/go decision always belongs to the supervisor.</text>
</svg>
