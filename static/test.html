<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>HeatSafe — Voice</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/test.css" />
</head>
<body class="test-page">
  <header class="top slim">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">HeatSafe</span>
    </div>
    <a class="top-link" href="/">←</a>
  </header>

  <main class="voice-screen">
    <div class="transcript" id="transcript" hidden></div>

    <div class="voice-center" aria-live="polite">
      <div class="orb-stage">
        <span class="orb-halo" aria-hidden="true"></span>
        <span class="orb-halo orb-halo-2" aria-hidden="true"></span>
        <button id="talk-btn" class="orb" type="button" data-state="idle" aria-label="Start conversation">
          <svg class="orb-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
      </div>
      <p class="voice-status" id="voice-status">Tap to talk</p>
    </div>

    <div class="slim-strip" id="conditions-strip" aria-live="polite">
      <span class="badge" id="verdict-badge" data-state="loading">…</span>
      <span class="strip-item" id="s-wind"></span>
      <span class="strip-item" id="s-gust"></span>
      <span class="strip-item" id="s-temp"></span>
      <button id="refresh-btn" class="strip-refresh" type="button" aria-label="Re-check conditions">↻</button>
    </div>
  </main>

  <script type="module" src="/static/test.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(console.error);
    }
  </script>
</body>
</html>
