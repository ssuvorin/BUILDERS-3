<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>HeatSafe — Voice</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/test.css" />
</head>
<body class="test-page">
  <header class="top slim">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">HeatSafe</span>
    </div>
    <a class="top-link" href="/">←</a>
  </header>

  <main class="voice-screen">
    <div class="transcript" id="transcript" hidden></div>

    <div class="voice-center" aria-live="polite">
      <button id="talk-btn" class="orb" type="button" data-state="idle" aria-label="Start conversation">
        <svg class="orb-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
      <p class="voice-status" id="voice-status">Tap to talk</p>
    </div>

    <div class="strip slim-strip" id="conditions-strip" aria-live="polite">
      <span class="badge" id="verdict-badge" data-state="loading">…</span>
      <span class="strip-item" id="s-wind"></span>
      <span class="strip-item" id="s-gust"></span>
      <span class="strip-item" id="s-temp"></span>
      <button id="refresh-btn" class="strip-refresh" type="button" aria-label="Re-check conditions">↻</button>
    </div>
  </main>

  <script type="module" src="/static/test.js"></script>
</body>
</html>
