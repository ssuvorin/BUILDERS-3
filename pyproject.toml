[project]
name = "builders"
version = "0.1.0"
description = "Site voice assistant backend: SOP retrieval + live weather webhooks for the ElevenLabs agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
